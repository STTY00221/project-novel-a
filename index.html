<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Math</title>
    <link rel="icon" type="image/png" href="image/icon.png">
    <link rel="preload" as="image" href="image/bg.png">
    <link rel="preload" as="image" href="image/creator-1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- นำเข้า Font สวยๆ จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;500&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           🎨 Design Tokens
           ============================================ */
        :root {
            --primary-color: #3b3b3b;
            --box-bg: rgba(0, 0, 0, 0.85);
            --text-color: #ffffff;
        }

        /* ============================================
           📐 Base Layout
           ============================================ */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Prompt', 'Segoe UI', Tahoma, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            /* ใช้ dvh เพื่อแก้ปัญหา address bar บนมือถือ */
            background-size: cover;
            background-position: center;
            transition: background-image 0.8s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            /* ป้องกัน pull-to-refresh และ overscroll บนมือถือ */
            overscroll-behavior: none;
            touch-action: manipulation;
        }

        /* Overlay สำหรับทำให้พื้นหลังมืดลงเล็กน้อยเวลาคุย */
        #game-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent 60%, rgba(0, 0, 0, 0.4));
            pointer-events: none;
        }

        /* ============================================
           🧍 Character Sprite — Position System
           ============================================ */
        #character-sprite {
            position: absolute;
            bottom: 10%;
            height: 50%;
            z-index: 2;
            cursor: pointer;
            /* transition สำหรับเปลี่ยนตำแหน่ง + fade */
            transition: left 0.6s ease, right 0.6s ease, opacity 0.4s ease, transform 0.6s ease;
            will-change: transform, opacity;
        }

        /* ตำแหน่ง: ซ้าย */
        #character-sprite.pos-left {
            left: 10%;
            right: auto;
            transform: translateX(0);
        }

        /* ตำแหน่ง: กลาง */
        #character-sprite.pos-center {
            left: 50%;
            right: auto;
            transform: translateX(-50%);
        }

        /* ตำแหน่ง: ขวา */
        #character-sprite.pos-right {
            left: auto;
            right: 10%;
            transform: translateX(0);
        }

        /* ============================================
           💬 Speaking Animation — เด้งขึ้นลงตอนพูด
           ============================================ */
        @keyframes speaking-bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        /* ต้อง override transform ตาม position ด้วย */
        #character-sprite.pos-left.speaking {
            animation: speaking-bounce-left 0.6s ease-in-out infinite;
        }

        #character-sprite.pos-center.speaking {
            animation: speaking-bounce-center 0.6s ease-in-out infinite;
        }

        #character-sprite.pos-right.speaking {
            animation: speaking-bounce-right 0.6s ease-in-out infinite;
        }

        @keyframes speaking-bounce-left {

            0%,
            100% {
                transform: translateX(0) translateY(0);
            }

            50% {
                transform: translateX(0) translateY(-8px);
            }
        }

        @keyframes speaking-bounce-center {

            0%,
            100% {
                transform: translateX(-50%) translateY(0);
            }

            50% {
                transform: translateX(-50%) translateY(-8px);
            }
        }

        @keyframes speaking-bounce-right {

            0%,
            100% {
                transform: translateX(0) translateY(0);
            }

            50% {
                transform: translateX(0) translateY(-8px);
            }
        }

        /* ============================================
           💬 Dialogue Box
           ============================================ */
        #dialogue-box {
            position: relative;
            width: 90%;
            max-width: 900px;
            min-height: 140px;
            background: var(--box-bg);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            margin-bottom: 20px;
            margin-bottom: max(20px, env(safe-area-inset-bottom));
            /* safe area สำหรับ notch */
            padding: 25px;
            box-sizing: border-box;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        #name-tag {
            position: absolute;
            top: -20px;
            left: 30px;
            background: var(--primary-color);
            color: rgb(255, 255, 255);
            padding: 5px 25px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        #text-content {
            color: var(--text-color);
            font-size: 1.2rem;
            line-height: 1.6;
            min-height: 1.6em;
            white-space: pre-wrap;
        }

        /* Typewriter cursor กระพริบ */
        #text-content.typing::after {
            content: "▌";
            animation: cursor-blink 0.6s step-end infinite;
            color: rgba(255, 255, 255, 0.7);
            margin-left: 2px;
        }

        @keyframes cursor-blink {
            50% {
                opacity: 0;
            }
        }

        /* ============================================
           🔘 Choices
           ============================================ */
        #choice-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            /* ซ่อนไว้ก่อน */
            flex-direction: column;
            gap: 15px;
            width: 300px;
            z-index: 100;
        }

        .choice-button {
            background: var(--box-bg);
            color: rgb(255, 255, 255);
            border: 1px solid var(--primary-color);
            padding: 15px 20px;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            font-size: 1rem;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .choice-button:hover {
            background: var(--primary-color);
            transform: scale(1.05);
        }

        /* ============================================
           📱 Responsive — โทรศัพท์แนวตั้ง (Portrait)
           ============================================ */
        @media screen and (max-width: 480px) {

            /* ตัวละครใหญ่ขึ้นหน่อย + ปรับตำแหน่ง */
            #character-sprite {
                height: 40%;
                bottom: 22%;
            }

            #character-sprite.pos-left {
                left: 2%;
            }

            #character-sprite.pos-right {
                right: 2%;
            }

            /* Dialogue box ปรับให้พอดีกับหน้าจอเล็ก */
            #dialogue-box {
                width: 94%;
                min-height: 120px;
                padding: 18px 15px;
                margin-bottom: max(12px, env(safe-area-inset-bottom));
                border-radius: 8px;
            }

            #name-tag {
                top: -16px;
                left: 15px;
                padding: 4px 16px;
                font-size: 0.9rem;
            }

            #text-content {
                font-size: 0.95rem;
                line-height: 1.5;
            }

            .click-hint {
                font-size: 0.7rem;
                bottom: 6px;
                right: 12px;
            }

            /* Choices ปรับ width ให้พอดีจอ */
            #choice-container {
                width: 85%;
                gap: 10px;
            }

            .choice-button {
                padding: 12px 15px;
                font-size: 0.9rem;
            }
        }

        /* ============================================
           📱 Responsive — โทรศัพท์แนวตั้งเล็กมาก
           ============================================ */
        @media screen and (max-width: 360px) {
            #character-sprite {
                height: 35%;
                bottom: 24%;
            }

            #dialogue-box {
                min-height: 100px;
                padding: 15px 12px;
            }

            #text-content {
                font-size: 0.85rem;
            }

            .choice-button {
                padding: 10px 12px;
                font-size: 0.85rem;
            }
        }

        /* ============================================
           📱 Responsive — โทรศัพท์แนวนอน (Landscape)
           ============================================ */
        @media screen and (max-height: 500px) and (orientation: landscape) {
            #character-sprite {
                height: 60%;
                bottom: 25%;
            }

            #dialogue-box {
                min-height: 90px;
                padding: 15px 20px;
                margin-bottom: max(8px, env(safe-area-inset-bottom));
            }

            #name-tag {
                top: -14px;
                font-size: 0.85rem;
                padding: 3px 15px;
            }

            #text-content {
                font-size: 0.9rem;
                line-height: 1.4;
            }

            .click-hint {
                font-size: 0.65rem;
                bottom: 4px;
            }

            #choice-container {
                flex-direction: row;
                flex-wrap: wrap;
                width: 80%;
                justify-content: center;
                gap: 8px;
            }

            .choice-button {
                padding: 8px 15px;
                font-size: 0.85rem;
                flex: 1 1 auto;
                min-width: 120px;
            }
        }

        /* ============================================
           📱 Responsive — Tablet / iPad
           ============================================ */
        @media screen and (min-width: 481px) and (max-width: 1024px) {
            #character-sprite {
                height: 48%;
            }

            #dialogue-box {
                width: 85%;
                min-height: 130px;
                padding: 22px;
            }

            #text-content {
                font-size: 1.1rem;
            }

            #choice-container {
                width: 350px;
            }

            .choice-button {
                padding: 14px 20px;
                font-size: 1rem;
            }
        }

        /* ============================================
           📱 Responsive — iPad แนวตั้ง (Portrait)
           ============================================ */
        @media screen and (min-width: 600px) and (max-width: 1024px) and (orientation: portrait) {
            #character-sprite {
                height: 40%;
                bottom: 18%;
            }

            #dialogue-box {
                margin-bottom: 30px;
            }
        }

        /* ============================================
           🔧 Admin Button
           ============================================ */
        #admin-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 0.78rem;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            opacity: 0.55;
            transition: opacity .2s, transform .2s;
        }
        #admin-btn:hover { opacity: 1; transform: translateY(-1px); }

        /* ============================================
           🎯 Progress Badge & 🏆 Best Record
           ============================================ */
        #progress-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-family: inherit;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            user-select: none;
            pointer-events: none;
        }
        #progress-badge .label { opacity: 0.7; margin-right: 6px; }
        #progress-badge .num { font-weight: 700; color: #ffd166; }

        #best-record {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            border: 1px solid rgba(255, 215, 102, 0.35);
            border-radius: 12px;
            padding: 10px 22px;
            font-size: 0.95rem;
            font-family: inherit;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            text-align: center;
            user-select: none;
            pointer-events: none;
        }
        #best-record .row { display: flex; gap: 18px; justify-content: center; margin-top: 4px; }
        #best-record .row span { font-size: 0.85rem; opacity: 0.85; }
        #best-record .row b { color: #ffd166; font-weight: 700; }

        /* ============================================
           ✨ Hints & Misc
           ============================================ */
        .click-hint {
            position: absolute;
            bottom: 10px;
            right: 20px;
            color: #888;
            font-size: 0.8rem;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div id="game-container" style="background-image: url('image/bg.png');">

        <a id="admin-btn" href="admin.html" title="Admin Panel">⚙️ Admin</a>

        <div id="progress-badge"><span class="label">🎯 ข้อที่</span><span class="num" id="progress-num">0 / 0</span></div>

        <div id="best-record">
            <div>🏆 <b>สถิติสูงสุด</b></div>
            <div class="row">
                <span>ดีที่สุด: <b id="best-num">0</b></span>
                <span>ครั้งล่าสุด: <b id="last-num">0</b></span>
            </div>
        </div>

        <img id="character-sprite" class="pos-center" onclick="handleSpriteClick(event)">

        <div id="choice-container"></div>

        <div id="dialogue-box" onclick="handleInput()">
            <div id="name-tag">ระบบ</div>
            <div id="text-content">กดเพื่อเริ่มเกม...</div>
            <div class="click-hint">กด คลิก ที่กล่องข้อความเพื่อไปต่อ</div>
        </div>
    </div>

    <script src="story.js"></script>
    <script>
        /* ============================================
           🎮 Visual Novel Engine
           ============================================ */

        // ----- ค่า Default (ใช้ถ้าไม่ได้ตั้งค่าใน story config) -----
        const DEFAULTS = {
            position: "center",   // "left" | "center" | "right"
            speaking: true,       // animation เด้งตอนพูด
            typeSpeed: 40,        // ms ต่อตัวอักษร
        };

        // ----- State -----
        let currentSceneId = "start";
        let isWaitingForChoice = false;
        let isTyping = false;
        let typewriterInterval = null;
        let typewriterFrame = null;
        let currentFullText = "";
        let currentBg = "";
        let currentSprite = "";
        let spriteFadeTimer = null;
        const preloadedAssets = new Set();

        // ----- 🎲 ประวัติการสุ่ม: จำว่า scene ไหนสุ่มไปยัง nextId ไหนแล้วบ้าง (ไม่ซ้ำ) -----
        const randomHistory = {};   // { sceneId: Set<nextId> }
        let lastRandomParent = null; // sceneId ของ random ล่าสุดที่เพิ่งสุ่ม (ใช้แสดง progress)

        // ----- 🏆 Best Record (เก็บใน localStorage) -----
        const STORAGE_KEY = "vn_best_record";
        function loadRecord() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { best: 0, last: 0 }; }
            catch { return { best: 0, last: 0 }; }
        }
        function saveRecord(rec) {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(rec)); } catch {}
        }
        // commit คะแนนรอบนี้: เปรียบเทียบกับ best แล้วเก็บ last
        function commitRunScore(score) {
            if (score <= 0) return;
            const rec = loadRecord();
            rec.last = score;
            if (score > rec.best) rec.best = score;
            saveRecord(rec);
        }

        // ----- ฉากลับ: นับจำนวนคลิกที่ตัวละคร -----
        let secretClickCount = 0;
        const SECRET_CLICKS_NEEDED = 10;  // จำนวนคลิกที่ต้องกด
        const SECRET_TRIGGER_SCENE = "1"; // scene ที่ trigger ฉากลับได้
        const SECRET_TARGET_SCENE = "s1"; // scene ที่จะไปเมื่อกดครบ

        // ----- DOM Elements -----
        const $container = document.getElementById('game-container');
        const $sprite = document.getElementById('character-sprite');
        const $nameTag = document.getElementById('name-tag');
        const $textContent = document.getElementById('text-content');
        const $choiceContainer = document.getElementById('choice-container');
        const $clickHint = document.querySelector('.click-hint');
        const $progress = document.getElementById('progress-badge');
        const $progNum = document.getElementById('progress-num');
        const $best = document.getElementById('best-record');
        const $bestNum = document.getElementById('best-num');
        const $lastNum = document.getElementById('last-num');

        function preloadImage(src) {
            if (!src || src === "null" || preloadedAssets.has(src)) return;
            preloadedAssets.add(src);
            const img = new Image();
            img.decoding = "async";
            img.src = src;
        }

        function preloadSceneAssets(scene) {
            preloadImage(scene.bg);
            preloadImage(scene.sprite);
            if (scene.next && storyScript[scene.next]) {
                preloadImage(storyScript[scene.next].bg);
                preloadImage(storyScript[scene.next].sprite);
            }
        }

        /* ============================================
           📖 Render Scene
           ============================================ */
        function renderScene(sceneId) {
            const scene = storyScript[sceneId];
            if (!scene) return;

            // 🏆 เมื่อเข้า scene "lose"/"win" → commit คะแนนรอบนี้
            if (sceneId === "lose" || sceneId === "win") {
                const parent = lastRandomParent;
                if (parent && randomHistory[parent]) {
                    let score = randomHistory[parent].size;
                    // ตอบผิด → ครั้งล่าสุดที่สุ่มยังไม่ได้นับ (ถูก mark used แล้ว) ต้องลบ 1
                    if (sceneId === "lose") score = Math.max(0, score - 1);
                    commitRunScore(score);
                }
                lastRandomParent = null; // กัน commit ซ้ำตอนเข้า start
            }

            // 🔄 รีเซ็ตประวัติการสุ่ม เมื่อกลับมาที่หน้า start (เล่นใหม่)
            if (sceneId === "start") {
                resetRandomHistory();
                lastRandomParent = null;
            }

            // 🎯 อัปเดต progress badge + best record UI
            updateOverlayUI(sceneId);

            // อ่านค่า config + ใช้ default ถ้าไม่มี
            const position = scene.position || DEFAULTS.position;
            const speaking = scene.speaking !== undefined ? scene.speaking : DEFAULTS.speaking;
            const typeSpeed = scene.typeSpeed !== undefined ? scene.typeSpeed : DEFAULTS.typeSpeed;
            preloadSceneAssets(scene);

            // --- ชื่อตัวละคร ---
            $nameTag.textContent = scene.name || "";

            // --- Background ---
            if (scene.bg && scene.bg !== "null" && scene.bg !== currentBg) {
                currentBg = scene.bg;
                $container.style.backgroundImage = `url('${scene.bg}')`;
            }

            // --- Character Sprite ---
            if (scene.sprite && scene.sprite !== "null") {
                // ลบ class position เก่า
                $sprite.classList.remove('pos-left', 'pos-center', 'pos-right', 'speaking');
                clearTimeout(spriteFadeTimer);

                const showSprite = () => {
                    $sprite.src = scene.sprite;
                    currentSprite = scene.sprite;
                    $sprite.classList.add(`pos-${position}`);
                    $sprite.style.opacity = 1;

                    // เริ่ม speaking animation ถ้าเปิด
                    if (speaking) {
                        $sprite.classList.add('speaking');
                    }
                };

                if (scene.sprite !== currentSprite) {
                    $sprite.style.opacity = 0;
                    spriteFadeTimer = setTimeout(showSprite, 120);
                } else {
                    showSprite();
                }
            } else if (scene.sprite === "null") {
                // ซ่อน sprite ถ้าตั้งค่าเป็น "null"
                clearTimeout(spriteFadeTimer);
                currentSprite = "";
                $sprite.style.opacity = 0;
                $sprite.classList.remove('speaking');
            }

            // --- Choices ---
            if (scene.choices) {
                isWaitingForChoice = true;
                $choiceContainer.innerHTML = '';
                $choiceContainer.style.display = 'flex';

                // 🔀 Shuffle ลำดับตัวเลือก (default: true เพื่อกันการจำตำแหน่ง)
                //    ปิดด้วย scene.shuffle === false
                const shouldShuffle = scene.shuffle !== false;
                const items = shouldShuffle ? shuffleArray(scene.choices) : scene.choices;

                // 🎯 ปลายทางเมื่อตอบถูก/ผิด (สำหรับ choice ที่ใช้ correct flag)
                const onCorrect = scene.onCorrect || "random";
                const onWrong  = scene.onWrong  || "lose";

                const fragment = document.createDocumentFragment();
                items.forEach(choice => {
                    const btn = document.createElement('div');
                    btn.className = 'choice-button';
                    btn.textContent = choice.text;
                    // รองรับทั้งแบบเก่า (nextId ตรงๆ) และแบบใหม่ (correct: true → onCorrect, อื่นๆ → onWrong)
                    const target = choice.nextId
                        ? choice.nextId
                        : (choice.correct ? onCorrect : onWrong);
                    btn.onclick = () => selectChoice(target);
                    fragment.appendChild(btn);
                });
                $choiceContainer.appendChild(fragment);

                // ซ่อน click hint ตอนมี choices
                $clickHint.style.display = 'none';
            } else {
                isWaitingForChoice = false;
                $choiceContainer.style.display = 'none';
                $clickHint.style.display = 'block';
            }

            // --- Typewriter Effect ---
            startTypewriter(scene.text || "", typeSpeed, speaking);
        }

        /* ============================================
           ⌨️ Typewriter System
           ============================================ */
        function startTypewriter(text, speed, speakingEnabled) {
            // หยุด typewriter เก่า (ถ้ามี)
            stopTypewriter();

            currentFullText = text;
            isTyping = true;
            $textContent.textContent = "";
            $textContent.classList.add('typing');

            let charIndex = 0;
            let lastTick = performance.now();
            let visibleText = "";

            const tick = (now) => {
                if (!isTyping) return;
                const elapsed = now - lastTick;
                const charsToAdd = Math.max(1, Math.floor(elapsed / Math.max(1, speed)));
                if (elapsed < speed) {
                    typewriterFrame = requestAnimationFrame(tick);
                    return;
                }
                lastTick = now;
                if (charIndex < currentFullText.length) {
                    const nextIndex = Math.min(currentFullText.length, charIndex + charsToAdd);
                    visibleText += currentFullText.slice(charIndex, nextIndex);
                    charIndex = nextIndex;
                    $textContent.textContent = visibleText;
                    typewriterFrame = requestAnimationFrame(tick);
                } else {
                    // พิมพ์เสร็จแล้ว!
                    finishTypewriter();
                }
            };

            typewriterFrame = requestAnimationFrame(tick);
        }

        function skipTypewriter() {
            // แสดงข้อความทั้งหมดทันที
            stopTypewriter();
            $textContent.textContent = currentFullText;
            finishTypewriter();
        }

        function stopTypewriter() {
            if (typewriterInterval) {
                clearInterval(typewriterInterval);
                typewriterInterval = null;
            }
            if (typewriterFrame) {
                cancelAnimationFrame(typewriterFrame);
                typewriterFrame = null;
            }
        }

        function finishTypewriter() {
            stopTypewriter();
            isTyping = false;
            $textContent.classList.remove('typing');

            // หยุด speaking animation เมื่อพิมพ์เสร็จ
            $sprite.classList.remove('speaking');
        }

        /* ============================================
           🖱️ Input Handler
           ============================================ */
        function handleInput() {
            // ถ้ากำลังพิมพ์อยู่ → Skip!
            if (isTyping) {
                skipTypewriter();
                return;
            }

            // ถ้ามีตัวเลือก → ไม่ทำอะไร (รอเลือก)
            if (isWaitingForChoice) return;

            // ไป scene ถัดไป
            const currentScene = storyScript[currentSceneId];
            if (!currentScene) return;

            // 🎲 ถ้ามี random list → สุ่มเลือก next scene (ไม่ซ้ำของเดิม)
            if (Array.isArray(currentScene.random) && currentScene.random.length) {
                const nextId = pickRandomNext(currentScene.random, currentSceneId, currentScene);
                if (nextId) {
                    currentSceneId = nextId;
                    renderScene(currentSceneId);
                }
                return;
            }

            if (currentScene.next) {
                currentSceneId = currentScene.next;
                renderScene(currentSceneId);
            } else if (currentScene.next === null) {
                // จบเรื่อง — ไม่ทำอะไร หรือจะ reset ก็ได้
            }
        }

        /* ============================================
           🎲 Random Next — รองรับ string หรือ {nextId, weight}
           ✨ ไม่ซ้ำของเดิม: จำว่าเคยสุ่มอะไรไปแล้วจาก scene นี้ (randomHistory)
           🏆 winCount: ถ้าตั้งค่า → เมื่อสุ่มไปแล้วครบ N ครั้ง จะ fallback ไป scene.next ทันที
              (ไม่ต้องสุ่มครบทุกข้อ — ใช้ทำเงื่อนไข "ชนะเมื่อตอบถูก N ข้อ")
           - ถ้าหมดตัวเลือก → fallback ไป scene.next (ถ้ามี) ไม่งั้นรีเซ็ตแล้วสุ่มใหม่
           ============================================ */
        function pickRandomNext(list, sceneId, scene) {
            const items = list
                .map(x => typeof x === "string"
                    ? { nextId: x, weight: 1 }
                    : { nextId: x.nextId, weight: Number(x.weight) || 1 })
                .filter(it => it.nextId);
            if (!items.length) return null;

            scene = scene || (storyScript[sceneId] || {});
            const used = randomHistory[sceneId] || (randomHistory[sceneId] = new Set());

            // 🏆 ถึงเกณฑ์ชนะแล้ว → ออกไป scene.next ทันที (ไม่ต้องสุ่มต่อ)
            const winCount = Number(scene.winCount) || 0;
            if (winCount > 0 && used.size >= winCount && scene.next) {
                return scene.next;
            }

            let pool = items.filter(it => !used.has(it.nextId));

            // หมดทุกตัวเลือกแล้ว
            if (!pool.length) {
                if (scene.next) return scene.next;       // ออกไป scene.next
                used.clear();                            // ไม่งั้น reset แล้วเริ่มสุ่มใหม่
                pool = items;
            }

            const total = pool.reduce((s, i) => s + i.weight, 0);
            let r = Math.random() * total;
            let picked = pool[pool.length - 1].nextId;
            for (const it of pool) {
                r -= it.weight;
                if (r <= 0) { picked = it.nextId; break; }
            }
            used.add(picked);
            lastRandomParent = sceneId; // 📊 จำว่าครั้งล่าสุดเรามาจาก random scene ไหน
            return picked;
        }

        // รีเซ็ตประวัติการสุ่มทั้งหมด (เรียกเมื่อเริ่มเกมใหม่)
        function resetRandomHistory() {
            for (const k in randomHistory) delete randomHistory[k];
        }

        /* ============================================
           🔀 Fisher–Yates Shuffle — สุ่มลำดับตัวเลือก
           ============================================ */
        function shuffleArray(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        /* ============================================
           🎯 Overlay UI — Progress Badge + Best Record
           ============================================ */
        function updateOverlayUI(sceneId) {
            // 🏆 Best Record: โชว์เฉพาะหน้า start
            if (sceneId === "start") {
                const rec = loadRecord();
                if (rec.best > 0 || rec.last > 0) {
                    $bestNum.textContent = rec.best;
                    $lastNum.textContent = rec.last;
                    $best.style.display = 'block';
                } else {
                    $best.style.display = 'none';
                }
            } else {
                $best.style.display = 'none';
            }

            // 🎯 Progress badge: โชว์ตอนอยู่ใน random round
            const parent = lastRandomParent;
            const inRandomRound = parent
                && randomHistory[parent]
                && sceneId !== "start" && sceneId !== "lose" && sceneId !== "win";
            if (inRandomRound) {
                const parentScene = storyScript[parent] || {};
                const total = Number(parentScene.winCount) > 0
                    ? Number(parentScene.winCount)
                    : (Array.isArray(parentScene.random) ? parentScene.random.length : 0);
                const done = randomHistory[parent].size; // ข้อปัจจุบันที่กำลังเล่น
                $progNum.textContent = `${done} / ${total || '?'}`;
                $progress.style.display = 'inline-block';
            } else {
                $progress.style.display = 'none';
            }
        }

        function selectChoice(nextId) {
            currentSceneId = nextId;
            isWaitingForChoice = false;
            $choiceContainer.style.display = 'none';
            $clickHint.style.display = 'block';
            renderScene(currentSceneId);
        }

        /* ============================================
           ⌨️ Keyboard Support
           ============================================ */
        window.addEventListener('keydown', (e) => {
            if (e.code === "Space" || e.code === "Enter") {
                e.preventDefault();
                handleInput();
            }
        });

        /* ============================================
           🔒 Secret Scene — คลิกที่ตัวละครเพื่อเข้าฉากลับ
           ============================================ */
        function handleSpriteClick(event) {
            // ไม่ให้ event ลงไปที่ dialogue box
            event.stopPropagation();

            // เช็คว่าอยู่ scene ที่ trigger ได้ไหม
            if (currentSceneId !== SECRET_TRIGGER_SCENE) {
                secretClickCount = 0;
                return;
            }

            secretClickCount++;

            // feedback เล็กๆ ตอนกด (ตัวละครสั่นนิดหน่อย)
            $sprite.style.filter = `brightness(${1 + secretClickCount * 0.1})`;
            setTimeout(() => {
                $sprite.style.filter = 'brightness(1)';
            }, 150);

            // กดครบ → เข้าฉากลับ!
            if (secretClickCount >= SECRET_CLICKS_NEEDED) {
                secretClickCount = 0;
                currentSceneId = SECRET_TARGET_SCENE;
                renderScene(currentSceneId);
            }
        }

        /* ============================================
           � Story Encryption (AES-GCM + PBKDF2)
           ป้องกันคนเปิด DevTools เห็นเฉลย — เปลี่ยน pass/salt ถ้า fork โปรเจกต์
           ⚠️ ไม่ใช่ security จริง — แค่ obfuscation กัน casual peek
           ============================================ */
        const STORY_ENC = {
            pass: "novel-quiz-mr-eakapot-2026",
            salt: new Uint8Array([78,111,118,101,108,81,117,105,122,83,97,108,116,33,50,54]),
            iterations: 100000,
            file: "story.enc.txt"
        };
        async function _deriveStoryKey() {
            const baseKey = await crypto.subtle.importKey(
                "raw", new TextEncoder().encode(STORY_ENC.pass),
                "PBKDF2", false, ["deriveKey"]
            );
            return crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: STORY_ENC.salt, iterations: STORY_ENC.iterations, hash: "SHA-256" },
                baseKey,
                { name: "AES-GCM", length: 256 },
                false, ["encrypt", "decrypt"]
            );
        }
        async function decryptStoryText(b64) {
            const key = await _deriveStoryKey();
            const data = Uint8Array.from(atob(b64.trim()), c => c.charCodeAt(0));
            const iv = data.slice(0, 12);
            const ct = data.slice(12);
            const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
            return new TextDecoder().decode(pt);
        }

        /* ============================================
           🚀 Init — โหลด story (ลอง encrypted ก่อน) แล้วเริ่ม
           ============================================ */
        (async function initStory() {
            try {
                const r = await fetch(STORY_ENC.file, { cache: "force-cache" });
                if (r.ok) {
                    const b64 = (await r.text()).trim();
                    if (b64) {
                        const json = await decryptStoryText(b64);
                        const obj = JSON.parse(json);
                        for (const k in storyScript) delete storyScript[k];
                        for (const k in obj) storyScript[k] = obj[k];
                        console.log("[story] loaded encrypted");
                    }
                }
            } catch (e) {
                console.warn("[story] encrypted load failed, using plain story.js", e);
            }
            renderScene("start");
        })();

    </script>
