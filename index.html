<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Math</title>
    <link rel="icon" type="image/png" href="image/icon.png">
    <link rel="preload" as="image" href="image/bg.png">
    <link rel="preload" as="image" href="image/creator-1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- นำเข้า Font สวยๆ จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;500&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           🎨 Design Tokens
           ============================================ */
        :root {
            --primary-color: #3b3b3b;
            --box-bg: rgba(0, 0, 0, 0.85);
            --text-color: #ffffff;
        }

        /* ============================================
           📐 Base Layout
           ============================================ */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Prompt', 'Segoe UI', Tahoma, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            /* ใช้ dvh เพื่อแก้ปัญหา address bar บนมือถือ */
            background-size: cover;
            background-position: center;
            transition: background-image 0.8s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            /* ป้องกัน pull-to-refresh และ overscroll บนมือถือ */
            overscroll-behavior: none;
            touch-action: manipulation;
        }

        /* Overlay สำหรับทำให้พื้นหลังมืดลงเล็กน้อยเวลาคุย */
        #game-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent 60%, rgba(0, 0, 0, 0.4));
            pointer-events: none;
        }

        /* ============================================
           🧍 Character Sprite — Position System
           ============================================ */
        #character-sprite {
            position: absolute;
            bottom: var(--sprite-bottom-offset, 10%);
            height: 50%;
            z-index: 8;
            cursor: pointer;
            /* transition สำหรับเปลี่ยนตำแหน่ง + fade */
            transition: left 0.6s ease, right 0.6s ease, opacity 0.4s ease, transform 0.6s ease;
            will-change: transform, opacity;
        }

        /* ตำแหน่ง: ซ้าย */
        #character-sprite.pos-left {
            left: 10%;
            right: auto;
            transform: translateX(0);
        }

        /* ตำแหน่ง: กลาง */
        #character-sprite.pos-center {
            left: 50%;
            right: auto;
            transform: translateX(-50%);
        }

        /* ตำแหน่ง: ขวา */
        #character-sprite.pos-right {
            left: auto;
            right: 10%;
            transform: translateX(0);
        }

        /* ============================================
           💬 Speaking Animation — เด้งขึ้นลงตอนพูด
           ============================================ */
        @keyframes speaking-bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        /* ต้อง override transform ตาม position ด้วย */
        #character-sprite.pos-left.speaking {
            animation: speaking-bounce-left 0.6s ease-in-out infinite;
        }

        #character-sprite.pos-center.speaking {
            animation: speaking-bounce-center 0.6s ease-in-out infinite;
        }

        #character-sprite.pos-right.speaking {
            animation: speaking-bounce-right 0.6s ease-in-out infinite;
        }

        @keyframes speaking-bounce-left {

            0%,
            100% {
                transform: translateX(0) translateY(0);
            }

            50% {
                transform: translateX(0) translateY(-8px);
            }
        }

        @keyframes speaking-bounce-center {

            0%,
            100% {
                transform: translateX(-50%) translateY(0);
            }

            50% {
                transform: translateX(-50%) translateY(-8px);
            }
        }

        @keyframes speaking-bounce-right {

            0%,
            100% {
                transform: translateX(0) translateY(0);
            }

            50% {
                transform: translateX(0) translateY(-8px);
            }
        }

        /* ============================================
           💬 Dialogue Box
           ============================================ */
        #dialogue-box {
            position: relative;
            width: 90%;
            max-width: 900px;
            min-height: 140px;
            background: var(--box-bg);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            margin-bottom: 20px;
            margin-bottom: max(20px, env(safe-area-inset-bottom));
            /* safe area สำหรับ notch */
            padding: 25px;
            box-sizing: border-box;
            cursor: pointer;
            z-index: 20;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        #name-tag {
            position: absolute;
            top: -20px;
            left: 30px;
            background: var(--primary-color);
            color: rgb(255, 255, 255);
            padding: 5px 25px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        #text-content {
            color: var(--text-color);
            font-size: 1.2rem;
            line-height: 1.6;
            min-height: 1.6em;
            white-space: pre-wrap;
        }

        /* Typewriter cursor กระพริบ */
        #text-content.typing::after {
            content: "▌";
            animation: cursor-blink 0.6s step-end infinite;
            color: rgba(255, 255, 255, 0.7);
            margin-left: 2px;
        }

        @keyframes cursor-blink {
            50% {
                opacity: 0;
            }
        }

        /* ============================================
           🔘 Choices
           ============================================ */
        #choice-container {
            position: static;
            top: auto;
            left: auto;
            transform: none;
            display: none;
            /* ซ่อนไว้ก่อน */
            flex-direction: column;
            gap: 10px;
            width: 100%;
            z-index: 100;
            box-sizing: border-box;
            max-height: min(36vh, 300px);
            overflow-y: auto;
            padding-right: 4px;
        }

        .choice-button {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            color: rgb(255, 255, 255);
            border: 1px solid rgba(255, 255, 255, 0.22);
            padding: 13px 16px;
            border-radius: 14px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 500;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .choice-button:hover {
            background: rgba(255, 209, 102, 0.18);
            border-color: rgba(255, 209, 102, 0.55);
            transform: translateY(-1px);
        }

        .choice-button:active {
            transform: translateY(0) scale(0.99);
        }

        #dialogue-box.choice-mode {
            min-height: 180px;
        }

        #text-content.is-hidden {
            display: none;
        }

        #choice-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        #choice-toolbar[hidden] {
            display: none;
        }

        #choice-mode-label {
            color: #ffd166;
            font-size: 0.92rem;
            font-weight: 700;
        }

        #question-toggle-btn {
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 999px;
            padding: 7px 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-family: inherit;
            font-size: 0.82rem;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        #question-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        /* ============================================
           📱 Responsive — โทรศัพท์แนวตั้ง (Portrait)
           ============================================ */
        @media screen and (max-width: 480px) {

            /* ตัวละครใหญ่ขึ้นหน่อย + ปรับตำแหน่ง */
            #character-sprite {
                height: 40%;
                bottom: var(--sprite-bottom-offset, 22%);
            }

            #character-sprite.pos-left {
                left: 2%;
            }

            #character-sprite.pos-right {
                right: 2%;
            }

            /* Dialogue box ปรับให้พอดีกับหน้าจอเล็ก */
            #dialogue-box {
                width: 94%;
                min-height: 120px;
                padding: 18px 15px;
                margin-bottom: max(12px, env(safe-area-inset-bottom));
                border-radius: 8px;
            }

            #name-tag {
                top: -16px;
                left: 15px;
                padding: 4px 16px;
                font-size: 0.9rem;
            }

            #text-content {
                font-size: 0.95rem;
                line-height: 1.5;
            }

            .click-hint {
                font-size: 0.7rem;
                bottom: 6px;
                right: 12px;
            }

            /* Choices ปรับ width ให้พอดีจอ */
            #choice-container {
                width: 100%;
                gap: 8px;
                max-height: 38vh;
            }

            .choice-button {
                padding: 11px 12px;
                font-size: 0.9rem;
            }

            #dialogue-box.choice-mode {
                min-height: 150px;
            }

            #choice-toolbar {
                margin-bottom: 10px;
            }
        }

        /* ============================================
           📱 Responsive — โทรศัพท์แนวตั้งเล็กมาก
           ============================================ */
        @media screen and (max-width: 360px) {
            #character-sprite {
                height: 35%;
                bottom: var(--sprite-bottom-offset, 24%);
            }

            #dialogue-box {
                min-height: 100px;
                padding: 15px 12px;
            }

            #text-content {
                font-size: 0.85rem;
            }

            .choice-button {
                padding: 10px 12px;
                font-size: 0.85rem;
            }

            #question-toggle-btn {
                padding: 6px 10px;
                font-size: 0.75rem;
            }
        }

        /* ============================================
           📱 Responsive — โทรศัพท์แนวนอน (Landscape)
           ============================================ */
        @media screen and (max-height: 500px) and (orientation: landscape) {
            #character-sprite {
                height: 60%;
                bottom: var(--sprite-bottom-offset, 25%);
            }

            #dialogue-box {
                min-height: 90px;
                padding: 15px 20px;
                margin-bottom: max(8px, env(safe-area-inset-bottom));
            }

            #name-tag {
                top: -14px;
                font-size: 0.85rem;
                padding: 3px 15px;
            }

            #text-content {
                font-size: 0.9rem;
                line-height: 1.4;
            }

            .click-hint {
                font-size: 0.65rem;
                bottom: 4px;
            }

            #choice-container {
                flex-direction: row;
                flex-wrap: wrap;
                width: 100%;
                justify-content: center;
                gap: 8px;
                max-height: 32vh;
            }

            .choice-button {
                padding: 8px 15px;
                font-size: 0.85rem;
                flex: 1 1 auto;
                min-width: 120px;
            }
        }

        /* ============================================
           📱 Responsive — Tablet / iPad
           ============================================ */
        @media screen and (min-width: 481px) and (max-width: 1024px) {
            #character-sprite {
                height: 48%;
            }

            #dialogue-box {
                width: 85%;
                min-height: 130px;
                padding: 22px;
            }

            #text-content {
                font-size: 1.1rem;
            }

            #choice-container {
                width: 100%;
            }

            .choice-button {
                padding: 14px 20px;
                font-size: 1rem;
            }
        }

        /* ============================================
           📱 Responsive — iPad แนวตั้ง (Portrait)
           ============================================ */
        @media screen and (min-width: 600px) and (max-width: 1024px) and (orientation: portrait) {
            #character-sprite {
                height: 40%;
                bottom: var(--sprite-bottom-offset, 18%);
            }

            #dialogue-box {
                margin-bottom: 30px;
            }
        }

        /* ============================================
           🔧 Admin Button
           ============================================ */
        #admin-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 170;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 0.78rem;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            opacity: 0.85;
            transition: opacity .2s, transform .2s;
        }
        #admin-btn:hover { opacity: 1; transform: translateY(-1px); }

        /* ============================================
           🎯 Progress Badge
           ============================================ */
        #progress-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-family: inherit;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            user-select: none;
            pointer-events: none;
        }
        #progress-badge .label { opacity: 0.7; margin-right: 6px; }
        #progress-badge .num { font-weight: 700; color: #ffd166; }

        #start-menu {
            position: absolute;
            inset: 0;
            z-index: 150;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 24px;
            box-sizing: border-box;
            background: radial-gradient(circle at center, rgba(255, 209, 102, 0.12), rgba(0, 0, 0, 0.78));
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }

        .start-menu-card {
            width: min(92vw, 440px);
            max-height: calc(100dvh - 48px);
            overflow-y: auto;
            padding: 34px 28px;
            box-sizing: border-box;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.78);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .start-menu-title {
            margin: 0;
            font-size: clamp(2.2rem, 8vw, 4rem);
            line-height: 1;
            color: #ffd166;
            text-shadow: 0 4px 24px rgba(255, 209, 102, 0.45);
        }

        .start-menu-subtitle {
            margin: 14px 0 26px;
            color: rgba(255, 255, 255, 0.78);
            font-size: 1rem;
        }

        .menu-button {
            width: 100%;
            border: 0;
            border-radius: 999px;
            padding: 14px 20px;
            margin-top: 12px;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform .2s, filter .2s, background .2s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .menu-button:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .menu-button.primary {
            background: linear-gradient(135deg, #ffd166, #ff8fab);
            color: #171717;
        }

        .menu-button.secondary {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .player-panel,
        .leaderboard-panel {
            margin-top: 18px;
            padding: 16px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            text-align: left;
        }

        .leaderboard-panel {
            margin-top: 14px;
        }

        #settings-panel {
            margin-top: 18px;
            padding: 18px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            text-align: left;
        }

        #settings-panel[hidden] {
            display: none;
        }

        .settings-label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.86);
            font-size: 0.92rem;
        }

        #username-input,
        #player-name-input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 12px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 1rem;
            color: #fff;
            background: rgba(0, 0, 0, 0.35);
            outline: none;
        }

        #username-input:focus,
        #player-name-input:focus {
            border-color: #ffd166;
            box-shadow: 0 0 0 3px rgba(255, 209, 102, 0.16);
        }

        .stat-note {
            margin-top: 8px;
            color: rgba(255, 255, 255, 0.58);
            font-size: 0.76rem;
            line-height: 1.45;
        }

        .leaderboard-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            color: #ffd166;
            font-weight: 700;
            font-size: 0.92rem;
        }

        .leaderboard-list {
            display: grid;
            gap: 8px;
        }

        .leaderboard-row {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 10px;
            align-items: center;
            padding: 9px 10px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.24);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .leaderboard-rank {
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            border-radius: 999px;
            background: rgba(255, 209, 102, 0.16);
            color: #ffd166;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .leaderboard-name {
            min-width: 0;
            overflow: hidden;
            color: #fff;
            font-size: 0.86rem;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .leaderboard-meta {
            color: rgba(255, 255, 255, 0.62);
            font-size: 0.72rem;
        }

        .leaderboard-score {
            color: #ffd166;
            font-size: 0.82rem;
            font-weight: 800;
            text-align: right;
            white-space: nowrap;
        }

        .empty-leaderboard {
            padding: 12px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.22);
            color: rgba(255, 255, 255, 0.62);
            font-size: 0.82rem;
            text-align: center;
        }

        .settings-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .settings-actions .menu-button {
            margin-top: 0;
            padding: 10px 14px;
            font-size: 0.92rem;
        }

        /* ============================================
           ✨ Hints & Misc
           ============================================ */
        .click-hint {
            position: absolute;
            bottom: 10px;
            right: 20px;
            color: #888;
            font-size: 0.8rem;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div id="game-container" style="background-image: url('image/bg.png');">

        <div id="progress-badge"><span class="label">🎯 ข้อที่</span><span class="num" id="progress-num">0 / 0</span></div>

        <div id="start-menu">
            <a id="admin-btn" href="admin.html" title="Admin Panel">⚙️ Admin</a>
            <div class="start-menu-card">
                <h1 class="start-menu-title">Game Math</h1>
                <p class="start-menu-subtitle">ผู้สอน: <span id="menu-teacher-name">Mr.EAKAPOT</span></p>
                <div class="player-panel">
                    <label class="settings-label" for="player-name-input">ชื่อผู้เล่น</label>
                    <input id="player-name-input" type="text" maxlength="32" autocomplete="off" placeholder="ใส่ชื่อของคุณ">
                    <div class="stat-note">ระบบจะจำชื่อ คะแนน เวลา และข้อมูลเครื่องไว้ในเครื่องนี้</div>
                </div>
                <div class="leaderboard-panel">
                    <div class="leaderboard-title">
                        <span>🏆 จัดอันดับในเครื่องนี้</span>
                        <span id="leaderboard-count">0 รอบ</span>
                    </div>
                    <div id="leaderboard-list" class="leaderboard-list"></div>
                </div>
                <button id="play-btn" class="menu-button primary" type="button">▶ Play</button>
                <button id="settings-btn" class="menu-button secondary" type="button">⚙ Setting</button>
                <div id="settings-panel" hidden>
                    <label class="settings-label" for="username-input">เปลี่ยนชื่อของ Mr.EAKAPOT</label>
                    <input id="username-input" type="text" maxlength="32" autocomplete="off">
                    <div class="settings-actions">
                        <button id="save-settings-btn" class="menu-button primary" type="button">บันทึก</button>
                        <button id="cancel-settings-btn" class="menu-button secondary" type="button">ยกเลิก</button>
                    </div>
                </div>
            </div>
        </div>

        <img id="character-sprite" class="pos-center" onclick="handleSpriteClick(event)">

        <div id="dialogue-box" onclick="handleInput()">
            <div id="name-tag">ระบบ</div>
            <div id="text-content">กดเพื่อเริ่มเกม...</div>
            <div id="choice-toolbar" hidden>
                <span id="choice-mode-label">เลือกคำตอบ</span>
                <button id="question-toggle-btn" type="button">ดูคำถาม</button>
            </div>
            <div id="choice-container"></div>
            <div class="click-hint">กด คลิก ที่กล่องข้อความเพื่อไปต่อ</div>
        </div>
    </div>

    <script src="story.js"></script>
    <script>
        /* ============================================
           🎮 Visual Novel Engine
           ============================================ */

        // ----- ค่า Default (ใช้ถ้าไม่ได้ตั้งค่าใน story config) -----
        const DEFAULTS = {
            position: "center",   // "left" | "center" | "right"
            speaking: true,       // animation เด้งตอนพูด
            typeSpeed: 40,        // ms ต่อตัวอักษร
        };
        const DEFAULT_TEACHER_NAME = "Mr.EAKAPOT";
        const TEACHER_NAME_STORAGE_KEY = "vn_teacher_name";
        const PLAYER_NAME_STORAGE_KEY = "vn_player_name";
        const PLAYER_STATS_STORAGE_KEY = "vn_player_stats";
        const CLIENT_INFO_STORAGE_KEY = "vn_client_info";
        const MAX_PLAYER_STATS = 100;
        const CLIENT_IP_MAX_AGE_MS = 6 * 60 * 60 * 1000;
        const STAGE_BACKGROUNDS = [
            { min: 1, max: 10, bg: "image/bg.png" },
            { min: 11, max: 15, bg: "image/bg1.png" },
            { min: 16, max: 20, bg: "image/bg2.png" },
            { min: 21, max: 25, bg: "image/bg3.png" },
            { min: 26, max: 30, bg: "image/bg4.png" },
        ];

        // ----- State -----
        let currentSceneId = "start";

        let typewriterInterval = null;
        let typewriterFrame = null;
        let currentFullText = "";
        let currentBg = "";
        let currentSprite = "";

        // ----- 🎲 ประวัติการสุ่ม: จำว่า scene ไหนสุ่มไปยัง nextId ไหนแล้วบ้าง (ไม่ซ้ำ) -----
        const randomHistory = {};   // { sceneId: Set<nextId> }
        let lastRandomParent = null; // sceneId ของ random ล่าสุดที่เพิ่งสุ่ม (ใช้แสดง progress)

        // ----- 🏆 Best Record (เก็บใน localStorage) -----
        const STORAGE_KEY = "vn_best_record";
        function loadRecord() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { best: 0, last: 0 }; }
            catch { return { best: 0, last: 0 }; }

        function saveRecord(rec) {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(rec)); } catch {}
        }
        // commit คะแนนรอบนี้: เปรียบเทียบกับ best แล้วเก็บ last
        function commitRunScore(score, outcome = "unknown") {
            score = Math.max(0, Number(score) || 0);
            const rec = loadRecord();
            rec.last = score;
            if (score > rec.best) rec.best = score;
            saveRecord(rec);
            savePlayerRun(score, outcome);
            updateLeaderboardUI();
        }

        function loadTeacherName() {
            try {
                const saved = localStorage.getItem(TEACHER_NAME_STORAGE_KEY);
                return saved && saved.trim() ? saved.trim() : DEFAULT_TEACHER_NAME;
            } catch {
                return DEFAULT_TEACHER_NAME;
            }
        }

        function saveTeacherName(name) {
            teacherName = name && name.trim() ? name.trim() : DEFAULT_TEACHER_NAME;
            try { localStorage.setItem(TEACHER_NAME_STORAGE_KEY, teacherName); } catch {}
            updateTeacherNameUI();
        }

        function updateTeacherNameUI() {
            $menuTeacherName.textContent = teacherName;
            if ($usernameInput) $usernameInput.value = teacherName;
        }

        function resolveSceneName(name) {
            return name === DEFAULT_TEACHER_NAME ? teacherName : (name || "");
        }

        function loadPlayerName() {
            try {
                const saved = localStorage.getItem(PLAYER_NAME_STORAGE_KEY);
                return saved && saved.trim() ? saved.trim() : "Player";
            } catch {
                return "Player";
            }
        }

        function savePlayerName(name) {
            playerName = name && name.trim() ? name.trim() : "Player";
            try { localStorage.setItem(PLAYER_NAME_STORAGE_KEY, playerName); } catch {}
            updatePlayerNameUI();
        }

        function updatePlayerNameUI() {
            if ($playerNameInput) $playerNameInput.value = playerName;
        }

        function loadPlayerStats() {
            try {
                const stats = JSON.parse(localStorage.getItem(PLAYER_STATS_STORAGE_KEY) || "[]");
                return Array.isArray(stats) ? stats : [];
            } catch {
                return [];
            }
        }

        function savePlayerStats(stats) {
            try { localStorage.setItem(PLAYER_STATS_STORAGE_KEY, JSON.stringify(stats)); } catch {}
        }

        function parseChromeVersion(userAgent) {
            const match = String(userAgent).match(/(?:Chrome|CriOS)\/([\d.]+)/);
            return match ? match[1] : "unknown";
        }

        function parseDeviceModel(userAgent) {
            const ua = String(userAgent);
            const ios = ua.match(/\((iPhone|iPad|iPod)[^)]*\)/);
            const android = ua.match(/Android[^;)]*;\s*([^;)]+)/);
            if (ios) return ios[1];
            if (android) return android[1].replace(/\s+Build\/.*$/i, "").trim();
            return navigator.platform || "unknown";
        }

        function createClientId() {
            return `client-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
        }

        function saveClientInfo(info) {
            try { localStorage.setItem(CLIENT_INFO_STORAGE_KEY, JSON.stringify(info)); } catch {}
        }

        function loadClientInfo() {
            let saved = {};
            try { saved = JSON.parse(localStorage.getItem(CLIENT_INFO_STORAGE_KEY) || "{}") || {}; } catch {}
            const userAgent = navigator.userAgent || "";
            const info = {
                ...saved,
                id: saved.id || createClientId(),
                deviceModel: parseDeviceModel(userAgent),
                chromeVersion: parseChromeVersion(userAgent),
                platform: navigator.platform || "unknown",
                language: navigator.language || "unknown",
                screen: `${screen.width}x${screen.height}`,
                userAgent,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "unknown",
                updatedAt: new Date().toISOString(),
            };
            saveClientInfo(info);
            return info;
        }

        async function refreshClientIp() {
            const fetchedAt = Date.parse(clientInfo.ipFetchedAt || 0);
            if (clientInfo.ip && Number.isFinite(fetchedAt) && Date.now() - fetchedAt < CLIENT_IP_MAX_AGE_MS) return;
            try {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 1500);
                const res = await fetch("https://api.ipify.org?format=json", { cache: "no-store", signal: controller.signal });
                clearTimeout(timer);
                if (!res.ok) return;
                const data = await res.json();
                if (!data.ip) return;
                clientInfo = {
                    ...clientInfo,
                    ip: data.ip,
                    ipFetchedAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };
                saveClientInfo(clientInfo);
            } catch {}
        }

        function formatDuration(ms) {
            const seconds = Math.max(0, Math.round((Number(ms) || 0) / 1000));
            const minutes = Math.floor(seconds / 60);
            const rest = seconds % 60;
            return minutes > 0 ? `${minutes}น ${rest}วิ` : `${rest}วิ`;
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function normalizeStatValue(value) {
            return String(value ?? "unknown").trim().toLowerCase() || "unknown";
        }

        function getPlayerStatKey(record) {
            return [
                normalizeStatValue(record.deviceId),
                normalizeStatValue(record.name),
                normalizeStatValue(record.ip)
            ].join("|");
        }

        function isBetterRun(newRecord, oldRecord) {
            const newScore = Number(newRecord.score) || 0;
            const oldScore = Number(oldRecord.score) || 0;
            if (newScore !== oldScore) return newScore > oldScore;
            const newTime = Number(newRecord.durationMs) || 0;
            const oldTime = Number(oldRecord.durationMs) || 0;
            if (newTime !== oldTime) return newTime < oldTime;
            return Date.parse(newRecord.endedAt || 0) > Date.parse(oldRecord.endedAt || 0);
        }

        function savePlayerRun(score, outcome) {
            const endedAt = Date.now();
            const startedAt = runStartedAt || endedAt;
            const durationMs = Math.max(0, endedAt - startedAt);
            const record = {
                id: `run-${endedAt.toString(36)}-${Math.random().toString(36).slice(2, 8)}`,
                name: playerName,
                score,
                outcome,
                durationMs,
                seconds: Math.round(durationMs / 1000),
                minutes: Number((durationMs / 60000).toFixed(2)),
                startedAt: new Date(startedAt).toISOString(),
                endedAt: new Date(endedAt).toISOString(),
                deviceId: clientInfo.id,
                deviceModel: clientInfo.deviceModel,
                chromeVersion: clientInfo.chromeVersion,
                ip: clientInfo.ip || "unknown",
                platform: clientInfo.platform,
                screen: clientInfo.screen,
                userAgent: clientInfo.userAgent,
            };
            const stats = loadPlayerStats();
            const recordKey = getPlayerStatKey(record);
            const existingIndex = stats.findIndex(item => getPlayerStatKey(item) === recordKey);
            if (existingIndex >= 0) {
                const existing = stats[existingIndex];
                if (isBetterRun(record, existing)) {
                    stats[existingIndex] = {
                        ...existing,
                        ...record,
                        id: existing.id || record.id,
                        firstPlayedAt: existing.firstPlayedAt || existing.startedAt || record.startedAt,
                        updatedAt: record.endedAt,
                        attempts: (Number(existing.attempts) || 1) + 1,
                    };
                } else {
                    stats[existingIndex] = {
                        ...existing,
                        lastAttemptAt: record.endedAt,
                        attempts: (Number(existing.attempts) || 1) + 1,
                    };
                }
            } else {
                stats.push({
                    ...record,
                    firstPlayedAt: record.startedAt,
                    updatedAt: record.endedAt,
                    attempts: 1,
                });
            }
            savePlayerStats(stats.slice(-MAX_PLAYER_STATS));
            runStartedAt = 0;
        }

        function updateLeaderboardUI() {
            if (!$leaderboardList || !$leaderboardCount) return;
            const stats = loadPlayerStats();
            $leaderboardCount.textContent = `${stats.length} สถิติ`;
            if (!stats.length) {
                $leaderboardList.innerHTML = `<div class="empty-leaderboard">ยังไม่มีสถิติ เริ่มเล่นเพื่อบันทึกอันดับแรก</div>`;
                return;
            }
            const top = stats.slice().sort((a, b) =>
                (Number(b.score) || 0) - (Number(a.score) || 0)
                || (Number(a.durationMs) || 0) - (Number(b.durationMs) || 0)
                || Date.parse(b.endedAt || 0) - Date.parse(a.endedAt || 0)
            ).slice(0, 5);
            $leaderboardList.innerHTML = top.map((item, index) => `
                <div class="leaderboard-row">
                    <div class="leaderboard-rank">${index + 1}</div>
                    <div>
                        <div class="leaderboard-name">${escapeHtml(item.name || "Player")}</div>
                        <div class="leaderboard-meta">${formatDuration(item.durationMs)} • เล่น ${Number(item.attempts) || 1} ครั้ง • ${escapeHtml(item.deviceModel || "unknown")}</div>
                    </div>
                    <div class="leaderboard-score">${Number(item.score) || 0} ข้อ</div>
                </div>
            `).join("");
        }

        function getStageBackground(stageNumber) {
            const stage = Number(stageNumber) || 0;
            const matched = STAGE_BACKGROUNDS.find(item => stage >= item.min && stage <= item.max);
            return matched ? matched.bg : "";
        }

        function getCurrentStageNumber(sceneId) {
            const parent = lastRandomParent;
            if (parent && parent !== sceneId && randomHistory[parent] && sceneId !== "start" && sceneId !== "lose" && sceneId !== "win") {
                return randomHistory[parent].size;
            }
            const match = /^c(\d+)$/.exec(sceneId);
            return match ? Number(match[1]) : 0;
        }

        function resolveSceneBackground(sceneId, scene) {
            return getStageBackground(getCurrentStageNumber(sceneId)) || scene.bg;
        }

        function setBackground(bg) {
            if (bg && bg !== "null" && bg !== currentBg) {
                currentBg = bg;
                $container.style.backgroundImage = `url('${bg}')`;

        function showStartMenu() {

        function startGame() {
            savePlayerName($playerNameInput.value);
            runStartedAt = Date.now();
            hideStartMenu();

            updateTeacherNameUI();

        function resetChoiceMode() {
            hasPendingChoices = false;
            isViewingQuestion = false;
            currentQuestionText = "";
            $dialogueBox.classList.remove('choice-mode');
            $textContent.classList.remove('is-hidden');

        function showChoicesInDialogue() {
            if (!hasPendingChoices) return;
            isViewingQuestion = false;
            $dialogueBox.classList.add('choice-mode');
            $textContent.classList.add('is-hidden');
            $choiceToolbar.hidden = false;
            $choiceContainer.style.display = 'flex';
            $questionToggleBtn.textContent = "ดูคำถาม";
            $choiceModeLabel.textContent = "เลือกคำตอบ";

            syncSpriteWithDialogue();
        }

        function showQuestionInDialogue() {
            if (!hasPendingChoices) return;
            isViewingQuestion = true;
            $dialogueBox.classList.add('choice-mode');
            $textContent.textContent = currentQuestionText;
            $textContent.classList.remove('is-hidden');
            $choiceToolbar.hidden = false;
            $choiceContainer.style.display = 'none';
            $questionToggleBtn.textContent = "กลับไปตอบ";

            $clickHint.style.display = 'none';
            syncSpriteWithDialogue();
        }

        function toggleQuestionView(event) {
            if (event) event.stopPropagation();
            if (isViewingQuestion) {
                showChoicesInDialogue();
            } else {
                showQuestionInDialogue();
            }
        }

        function syncSpriteWithDialogue() {
            if (isStartMenuOpen || $dialogueBox.style.display === 'none') {
                $sprite.style.removeProperty('--sprite-bottom-offset');
                return;
            }
            requestAnimationFrame(() => {
                const containerRect = $container.getBoundingClientRect();
                const dialogueRect = $dialogueBox.getBoundingClientRect();
                const spriteRect = $sprite.getBoundingClientRect();
                if (!dialogueRect.height || !spriteRect.height) return;
                const safeGap = Math.max(24, Math.round(containerRect.height * 0.035));
                const targetOffset = containerRect.bottom - dialogueRect.top + safeGap;
                $sprite.style.setProperty('--sprite-bottom-offset', `${Math.ceil(targetOffset)}px`);
            });
        }

        function preloadImage(src) {
            if (!src || src === "null" || preloadedAssets.has(src)) return;
            preloadedAssets.add(src);
            const img = new Image();
            img.decoding = "async";
            img.src = src;
        }

        function scheduleIdleTask(task, timeout = 1500) {
            if ("requestIdleCallback" in window) {
                requestIdleCallback(task, { timeout });
                return;
            }
            setTimeout(task, Math.min(timeout, 800));
        }

        function warmupLaterStageBackgrounds() {
            if (backgroundWarmupStarted) return;
            backgroundWarmupStarted = true;
            const laterBackgrounds = STAGE_BACKGROUNDS
                .map(item => item.bg)
                .filter(bg => bg && bg !== "image/bg.png");
            laterBackgrounds.forEach((bg, index) => {
                scheduleIdleTask(() => preloadImage(bg), 1800 + index * 700);
            });
        }

        function preloadSceneAssets(scene, sceneId) {
            preloadImage(resolveSceneBackground(sceneId, scene));
            preloadImage(scene.sprite);
            if (scene.next && storyScript[scene.next]) {
                preloadImage(resolveSceneBackground(scene.next, storyScript[scene.next]));
                preloadImage(storyScript[scene.next].sprite);
            }
        }

        /* ============================================
           📖 Render Scene
           ============================================ */
        function renderScene(sceneId) {
            const scene = storyScript[sceneId];
            if (!scene) return;

            // 🏆 เมื่อเข้า scene "lose"/"win" → commit คะแนนรอบนี้
            if (sceneId === "lose" || sceneId === "win") {
                const parent = lastRandomParent;
                if (parent && randomHistory[parent]) {
                    let score = randomHistory[parent].size;
                    // ตอบผิด → ครั้งล่าสุดที่สุ่มยังไม่ได้นับ (ถูก mark used แล้ว) ต้องลบ 1
                    if (sceneId === "lose") score = Math.max(0, score - 1);
                    commitRunScore(score, sceneId);
                }
                lastRandomParent = null; // กัน commit ซ้ำตอนเข้า start
            }

            // 🔄 รีเซ็ตประวัติการสุ่ม เมื่อกลับมาที่หน้า start (เล่นใหม่)
            if (sceneId === "start") {
                resetRandomHistory();
                lastRandomParent = null;
            }

            // 🎯 อัปเดต progress badge + best record UI
            updateOverlayUI(sceneId);

            if (sceneId === "start") {
                showStartMenu();
                return;
            }

            if (isStartMenuOpen) hideStartMenu();
            resetChoiceMode();

            // อ่านค่า config + ใช้ default ถ้าไม่มี
            const position = scene.position || DEFAULTS.position;
            const speaking = scene.speaking !== undefined ? scene.speaking : DEFAULTS.speaking;
            const typeSpeed = scene.typeSpeed !== undefined ? scene.typeSpeed : DEFAULTS.typeSpeed;
            preloadSceneAssets(scene, sceneId);

            // --- ชื่อตัวละคร ---
            $nameTag.textContent = resolveSceneName(scene.name);

            // --- Background ---
            setBackground(resolveSceneBackground(sceneId, scene));

            // --- Character Sprite ---
            if (scene.sprite && scene.sprite !== "null") {
                // ลบ class position เก่า
                $sprite.classList.remove('pos-left', 'pos-center', 'pos-right', 'speaking');
                clearTimeout(spriteFadeTimer);

                const showSprite = () => {
                    $sprite.src = scene.sprite;
                    currentSprite = scene.sprite;
                    $sprite.classList.add(`pos-${position}`);
                    $sprite.style.opacity = 1;

                    // เริ่ม speaking animation ถ้าเปิด
                    if (speaking) {
                        $sprite.classList.add('speaking');
                    }
                };

                if (scene.sprite !== currentSprite) {
                    $sprite.style.opacity = 0;
                    spriteFadeTimer = setTimeout(showSprite, 120);
                } else {
                    showSprite();
                }
            } else if (scene.sprite === "null") {
                // ซ่อน sprite ถ้าตั้งค่าเป็น "null"
                clearTimeout(spriteFadeTimer);
                currentSprite = "";
                $sprite.style.opacity = 0;
                $sprite.classList.remove('speaking');
            }

            // --- Choices ---
            if (scene.choices) {
                isWaitingForChoice = true;
                hasPendingChoices = true;
                currentQuestionText = scene.text || "";
                $choiceContainer.innerHTML = '';
                $choiceContainer.style.display = 'none';

                // 🔀 Shuffle ลำดับตัวเลือก (default: true เพื่อกันการจำตำแหน่ง)
                //    ปิดด้วย scene.shuffle === false
                const shouldShuffle = scene.shuffle !== false;
                const items = shouldShuffle ? shuffleArray(scene.choices) : scene.choices;

                // 🎯 ปลายทางเมื่อตอบถูก/ผิด (สำหรับ choice ที่ใช้ correct flag)
                const onCorrect = scene.onCorrect || "random";
                const onWrong  = scene.onWrong  || "lose";

                const fragment = document.createDocumentFragment();
                items.forEach(choice => {
                    const btn = document.createElement('div');
                    btn.className = 'choice-button';
                    btn.textContent = choice.text;
                    // รองรับทั้งแบบเก่า (nextId ตรงๆ) และแบบใหม่ (correct: true → onCorrect, อื่นๆ → onWrong)
                    const target = choice.nextId
                        ? choice.nextId
                        : (choice.correct ? onCorrect : onWrong);
                    btn.onclick = (event) => {
                        event.stopPropagation();
                        selectChoice(target);
                    };
                    fragment.appendChild(btn);
                });
                $choiceContainer.appendChild(fragment);
                $questionToggleBtn.onclick = toggleQuestionView;

                // ซ่อน click hint ตอนมี choices
                $clickHint.style.display = 'none';
            } else {
                isWaitingForChoice = false;
                $clickHint.style.display = 'block';
            }

            // --- Typewriter Effect ---
            startTypewriter(scene.text || "", typeSpeed, speaking);
            syncSpriteWithDialogue();
        }

        /* ============================================
           ⌨️ Typewriter System
           ============================================ */
        function startTypewriter(text, speed, speakingEnabled) {
            // หยุด typewriter เก่า (ถ้ามี)
            stopTypewriter();

            currentFullText = text;
            isTyping = true;
            $textContent.textContent = "";
            $textContent.classList.add('typing');

            let charIndex = 0;
            let lastTick = performance.now();
            let visibleText = "";

            const tick = (now) => {
                if (!isTyping) return;
                const elapsed = now - lastTick;
                const charsToAdd = Math.max(1, Math.floor(elapsed / Math.max(1, speed)));
                if (elapsed < speed) {
                    typewriterFrame = requestAnimationFrame(tick);
                    return;
                }
                lastTick = now;
                if (charIndex < currentFullText.length) {
                    const nextIndex = Math.min(currentFullText.length, charIndex + charsToAdd);
                    visibleText += currentFullText.slice(charIndex, nextIndex);
                    charIndex = nextIndex;
                    $textContent.textContent = visibleText;
                    syncSpriteWithDialogue();
                    typewriterFrame = requestAnimationFrame(tick);
                } else {
                    // พิมพ์เสร็จแล้ว!
                    finishTypewriter();
                }
            };

            typewriterFrame = requestAnimationFrame(tick);
        }

        function skipTypewriter() {
            // แสดงข้อความทั้งหมดทันที
            stopTypewriter();
            $textContent.textContent = currentFullText;
            syncSpriteWithDialogue();
            finishTypewriter();
        }

        function stopTypewriter() {
            if (typewriterInterval) {
                clearInterval(typewriterInterval);
                typewriterInterval = null;
            }
            if (typewriterFrame) {
                cancelAnimationFrame(typewriterFrame);
                typewriterFrame = null;
            }
        }

        function finishTypewriter() {
            stopTypewriter();
            isTyping = false;
            $textContent.classList.remove('typing');

            // หยุด speaking animation เมื่อพิมพ์เสร็จ
            $sprite.classList.remove('speaking');

            if (hasPendingChoices && !isViewingQuestion) {
                showChoicesInDialogue();
            }
            syncSpriteWithDialogue();
        }

        /* ============================================
           🖱️ Input Handler
           ============================================ */
        function handleInput() {
            // ถ้ากำลังพิมพ์อยู่ → Skip!
            if (isTyping) {
                skipTypewriter();
                return;
            }

            // ถ้ามีตัวเลือก → ไม่ทำอะไร (รอเลือก)
            if (isWaitingForChoice) return;

            // ไป scene ถัดไป
            const currentScene = storyScript[currentSceneId];
            if (!currentScene) return;

            // 🎲 ถ้ามี random list → สุ่มเลือก next scene (ไม่ซ้ำของเดิม)
            if (Array.isArray(currentScene.random) && currentScene.random.length) {
                const nextId = pickRandomNext(currentScene.random, currentSceneId, currentScene);
                if (nextId) {
                    currentSceneId = nextId;
                    renderScene(currentSceneId);
                }
                return;
            }

            if (currentScene.next) {
                currentSceneId = currentScene.next;
                renderScene(currentSceneId);
            } else if (currentScene.next === null) {
                // จบเรื่อง — ไม่ทำอะไร หรือจะ reset ก็ได้
            }
        }

        /* ============================================
           🎲 Random Next — รองรับ string หรือ {nextId, weight}
           ✨ ไม่ซ้ำของเดิม: จำว่าเคยสุ่มอะไรไปแล้วจาก scene นี้ (randomHistory)
           🏆 winCount: ถ้าตั้งค่า → เมื่อสุ่มไปแล้วครบ N ครั้ง จะ fallback ไป scene.next ทันที
              (ไม่ต้องสุ่มครบทุกข้อ — ใช้ทำเงื่อนไข "ชนะเมื่อตอบถูก N ข้อ")
           - ถ้าหมดตัวเลือก → fallback ไป scene.next (ถ้ามี) ไม่งั้นรีเซ็ตแล้วสุ่มใหม่
           ============================================ */
        function pickRandomNext(list, sceneId, scene) {
            const items = list
                .map(x => typeof x === "string"
                    ? { nextId: x, weight: 1 }
                    : { nextId: x.nextId, weight: Number(x.weight) || 1 })
                .filter(it => it.nextId);
            if (!items.length) return null;

            scene = scene || (storyScript[sceneId] || {});
            const used = randomHistory[sceneId] || (randomHistory[sceneId] = new Set());

            // 🏆 ถึงเกณฑ์ชนะแล้ว → ออกไป scene.next ทันที (ไม่ต้องสุ่มต่อ)
            const winCount = Number(scene.winCount) || 0;
            if (winCount > 0 && used.size >= winCount && scene.next) {
                return scene.next;
            }

            let pool = items.filter(it => !used.has(it.nextId));

            // หมดทุกตัวเลือกแล้ว
            if (!pool.length) {
                if (scene.next) return scene.next;       // ออกไป scene.next
                used.clear();                            // ไม่งั้น reset แล้วเริ่มสุ่มใหม่
                pool = items;
            }

            const total = pool.reduce((s, i) => s + i.weight, 0);
            let r = Math.random() * total;
            let picked = pool[pool.length - 1].nextId;
            for (const it of pool) {
                r -= it.weight;
                if (r <= 0) { picked = it.nextId; break; }
            }
            used.add(picked);
            lastRandomParent = sceneId; // 📊 จำว่าครั้งล่าสุดเรามาจาก random scene ไหน
            return picked;
        }

        // รีเซ็ตประวัติการสุ่มทั้งหมด (เรียกเมื่อเริ่มเกมใหม่)
        function resetRandomHistory() {
            for (const k in randomHistory) delete randomHistory[k];
        }

        /* ============================================
           🔀 Fisher–Yates Shuffle — สุ่มลำดับตัวเลือก
           ============================================ */
        function shuffleArray(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        /* ============================================
           🎯 Overlay UI — Progress Badge
           ============================================ */
        function updateOverlayUI(sceneId) {
            // 🎯 Progress badge: โชว์ตอนอยู่ใน random round
            const parent = lastRandomParent;
            const inRandomRound = parent
                && randomHistory[parent]
                && sceneId !== "start" && sceneId !== "lose" && sceneId !== "win";
            if (inRandomRound) {
                const parentScene = storyScript[parent] || {};
                const total = Number(parentScene.winCount) > 0
                    ? Number(parentScene.winCount)
                    : (Array.isArray(parentScene.random) ? parentScene.random.length : 0);
                const done = randomHistory[parent].size; // ข้อปัจจุบันที่กำลังเล่น
                $progNum.textContent = `${done} / ${total || '?'}`;
                $progress.style.display = 'inline-block';
            } else {
                $progress.style.display = 'none';
            }
        }

        function selectChoice(nextId) {
            currentSceneId = nextId;
            isWaitingForChoice = false;
            resetChoiceMode();
            renderScene(currentSceneId);
        }

        /* ============================================
           ⌨️ Keyboard Support
           ============================================ */
        window.addEventListener('keydown', (e) => {
            if (isStartMenuOpen) return;
            if (["BUTTON", "INPUT", "TEXTAREA"].includes(e.target?.tagName)) return;
            if (e.code === "Space" || e.code === "Enter") {
                e.preventDefault();
                handleInput();
            }
        });

        window.addEventListener('resize', syncSpriteWithDialogue);

        /* ============================================
           🔒 Secret Scene — คลิกที่ตัวละครเพื่อเข้าฉากลับ
           ============================================ */
        function handleSpriteClick(event) {
            // ไม่ให้ event ลงไปที่ dialogue box
            event.stopPropagation();

            // เช็คว่าอยู่ scene ที่ trigger ได้ไหม
            if (currentSceneId !== SECRET_TRIGGER_SCENE) {
                secretClickCount = 0;
                return;
            }

            secretClickCount++;

            // feedback เล็กๆ ตอนกด (ตัวละครสั่นนิดหน่อย)
            $sprite.style.filter = `brightness(${1 + secretClickCount * 0.1})`;
            setTimeout(() => {
                $sprite.style.filter = 'brightness(1)';
            }, 150);

            // กดครบ → เข้าฉากลับ!
            if (secretClickCount >= SECRET_CLICKS_NEEDED) {
                secretClickCount = 0;
                currentSceneId = SECRET_TARGET_SCENE;
                renderScene(currentSceneId);
            }
        }

        /* ============================================
           � Story Encryption (AES-GCM + PBKDF2)
           ป้องกันคนเปิด DevTools เห็นเฉลย — เปลี่ยน pass/salt ถ้า fork โปรเจกต์
           ⚠️ ไม่ใช่ security จริง — แค่ obfuscation กัน casual peek
           ============================================ */
        const STORY_ENC = {
            pass: "novel-quiz-mr-eakapot-2026",
            salt: new Uint8Array([78,111,118,101,108,81,117,105,122,83,97,108,116,33,50,54]),
            iterations: 100000,
            file: "story.enc.txt"
        };
        async function _deriveStoryKey() {
            const baseKey = await crypto.subtle.importKey(
                "raw", new TextEncoder().encode(STORY_ENC.pass),
                "PBKDF2", false, ["deriveKey"]
            );
            return crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: STORY_ENC.salt, iterations: STORY_ENC.iterations, hash: "SHA-256" },
                baseKey,
                { name: "AES-GCM", length: 256 },
                false, ["encrypt", "decrypt"]
            );
        }
        async function decryptStoryText(b64) {
            const key = await _deriveStoryKey();
            const data = Uint8Array.from(atob(b64.trim()), c => c.charCodeAt(0));
            const iv = data.slice(0, 12);
            const ct = data.slice(12);
            const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
            return new TextDecoder().decode(pt);
        }

        /* ============================================
           🚀 Init — โหลด story (ลอง encrypted ก่อน) แล้วเริ่ม
           ============================================ */
        (async function initStory() {
            try {
                const r = await fetch(STORY_ENC.file, { cache: "force-cache" });
                if (r.ok) {
                    const b64 = (await r.text()).trim();
                    if (b64) {
                        const json = await decryptStoryText(b64);
                        const obj = JSON.parse(json);
                        for (const k in storyScript) delete storyScript[k];
                        for (const k in obj) storyScript[k] = obj[k];
                        console.log("[story] loaded encrypted");
                    }
                }
            } catch (e) {
                console.warn("[story] encrypted load failed, using plain story.js", e);
            }
            renderScene("start");
        })();
        bindMenuEvents();
        refreshClientIp();

    </script>
