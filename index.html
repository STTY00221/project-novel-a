<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Math</title>
    <link rel="icon" type="image/png" href="image/icon.png">
    <link rel="preload" as="image" href="image/bg.png">
    <link rel="preload" as="image" href="image/creator-1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3b3b3b;
            --box-bg: rgba(0, 0, 0, 0.85);
            --text-color: #ffffff;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Prompt', 'Segoe UI', Tahoma, sans-serif;
        }

        #game-container.shake-active {
            animation: screen-shake 0.1s infinite;
        }

        @keyframes screen-shake {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(calc(-1 * var(--shake-intensity, 5px)), calc(-1 * var(--shake-intensity, 5px))); }
            20% { transform: translate(var(--shake-intensity, 5px), 0px); }
            30% { transform: translate(0px, var(--shake-intensity, 5px)); }
            40% { transform: translate(calc(-1 * var(--shake-intensity, 5px)), var(--shake-intensity, 5px)); }
            50% { transform: translate(var(--shake-intensity, 5px), calc(-1 * var(--shake-intensity, 5px))); }
            60% { transform: translate(calc(-1 * var(--shake-intensity, 5px)), 0px); }
            70% { transform: translate(0px, calc(-1 * var(--shake-intensity, 5px))); }
            80% { transform: translate(var(--shake-intensity, 5px), var(--shake-intensity, 5px)); }
            90% { transform: translate(calc(-1 * var(--shake-intensity, 5px)), calc(-1 * var(--shake-intensity, 5px))); }
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-size: cover;
            background-position: center;
            transition: background-image 0.8s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            overscroll-behavior: none;
            touch-action: manipulation;
        }

        #game-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent 60%, rgba(0, 0, 0, 0.4));
            pointer-events: none;
        }

        #character-sprite {
            position: absolute;
            bottom: var(--sprite-bottom-offset, 10%);
            height: 50%;
            z-index: 8;
            cursor: pointer;
            transition: left 0.6s ease, right 0.6s ease, opacity 0.4s ease, transform 0.6s ease;
            will-change: transform, opacity;
        }

        #character-sprite.pos-left {
            left: 10%;
            right: auto;
            transform: translateX(0);
        }

        #character-sprite.pos-center {
            left: 50%;
            right: auto;
            transform: translateX(-50%);
        }

        #character-sprite.pos-right {
            left: auto;
            right: 10%;
            transform: translateX(0);
        }

        @keyframes speaking-bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes speaking-bounce-left {

            0%,
            100% {
                transform: translateX(0) translateY(0);
            }

            50% {
                transform: translateX(0) translateY(-8px);
            }
        }

        @keyframes speaking-bounce-center {

            0%,
            100% {
                transform: translateX(-50%) translateY(0);
            }

            50% {
                transform: translateX(-50%) translateY(-8px);
            }
        }

        @keyframes speaking-bounce-right {

            0%,
            100% {
                transform: translateX(0) translateY(0);
            }

            50% {
                transform: translateX(0) translateY(-8px);
            }
        }

        #character-sprite.pos-left.speaking {
            animation: speaking-bounce-left 0.6s ease-in-out infinite;
        }

        #character-sprite.pos-center.speaking {
            animation: speaking-bounce-center 0.6s ease-in-out infinite;
        }

        #character-sprite.pos-right.speaking {
            animation: speaking-bounce-right 0.6s ease-in-out infinite;
        }

        #dialogue-box {
            position: relative;
            width: 90%;
            max-width: 900px;
            min-height: 140px;
            background: var(--box-bg);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            margin-bottom: 20px;
            margin-bottom: max(20px, env(safe-area-inset-bottom));
            padding: 25px;
            box-sizing: border-box;
            cursor: pointer;
            z-index: 20;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        #name-tag {
            position: absolute;
            top: -20px;
            left: 30px;
            background: var(--primary-color);
            color: rgb(255, 255, 255);
            padding: 5px 25px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        #text-content {
            color: var(--text-color);
            font-size: 1.2rem;
            line-height: 1.6;
            min-height: 1.6em;
            white-space: pre-wrap;
        }

        #text-content.typing::after {
            content: "\258C";
            animation: cursor-blink 0.6s step-end infinite;
            color: rgba(255, 255, 255, 0.7);
            margin-left: 2px;
        }

        @keyframes cursor-blink {
            50% {
                opacity: 0;
            }
        }

        #choice-container {
            position: static;
            top: auto;
            left: auto;
            transform: none;
            display: none;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            z-index: 100;
            box-sizing: border-box;
            max-height: min(36vh, 300px);
            overflow-y: auto;
            padding-right: 4px;
        }

        .choice-button {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            color: rgb(255, 255, 255);
            border: 1px solid rgba(255, 255, 255, 0.22);
            padding: 13px 16px;
            border-radius: 14px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 500;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .choice-button:hover {
            background: rgba(255, 209, 102, 0.18);
            border-color: rgba(255, 209, 102, 0.55);
            transform: translateY(-1px);
        }

        .choice-button:active {
            transform: translateY(0) scale(0.99);
        }

        #dialogue-box.choice-mode {
            min-height: 180px;
        }

        #text-content.is-hidden {
            display: none;
        }

        #choice-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        #choice-toolbar[hidden] {
            display: none;
        }

        #choice-mode-label {
            color: #ffd166;
            font-size: 0.92rem;
            font-weight: 700;
        }

        #question-toggle-btn {
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 999px;
            padding: 7px 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-family: inherit;
            font-size: 0.82rem;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        #question-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        @media screen and (max-width: 480px) {
            #character-sprite {
                height: 40%;
                bottom: var(--sprite-bottom-offset, 22%);
            }

            #character-sprite.pos-left {
                left: 2%;
            }

            #character-sprite.pos-right {
                right: 2%;
            }

            #dialogue-box {
                width: 94%;
                min-height: 120px;
                padding: 18px 15px;
                margin-bottom: max(12px, env(safe-area-inset-bottom));
                border-radius: 8px;
            }

            #name-tag {
                top: -16px;
                left: 15px;
                padding: 4px 16px;
                font-size: 0.9rem;
            }

            #text-content {
                font-size: 0.95rem;
                line-height: 1.5;
            }

            .click-hint {
                font-size: 0.7rem;
                bottom: 6px;
                right: 12px;
            }

            #choice-container {
                width: 100%;
                gap: 8px;
                max-height: 38vh;
            }

            .choice-button {
                padding: 11px 12px;
                font-size: 0.9rem;
            }

            #dialogue-box.choice-mode {
                min-height: 150px;
            }

            #choice-toolbar {
                margin-bottom: 10px;
            }
        }

        @media screen and (max-width: 360px) {
            #character-sprite {
                height: 35%;
                bottom: var(--sprite-bottom-offset, 24%);
            }

            #dialogue-box {
                min-height: 100px;
                padding: 15px 12px;
            }

            #text-content {
                font-size: 0.85rem;
            }

            .choice-button {
                padding: 10px 12px;
                font-size: 0.85rem;
            }

            #question-toggle-btn {
                padding: 6px 10px;
                font-size: 0.75rem;
            }
        }

        @media screen and (max-height: 500px) and (orientation: landscape) {
            #character-sprite {
                height: 60%;
                bottom: var(--sprite-bottom-offset, 25%);
            }

            #dialogue-box {
                min-height: 90px;
                padding: 15px 20px;
                margin-bottom: max(8px, env(safe-area-inset-bottom));
            }

            #name-tag {
                top: -14px;
                font-size: 0.85rem;
                padding: 3px 15px;
            }

            #text-content {
                font-size: 0.9rem;
                line-height: 1.4;
            }

            .click-hint {
                font-size: 0.65rem;
                bottom: 4px;
            }

            #choice-container {
                flex-direction: row;
                flex-wrap: wrap;
                width: 100%;
                justify-content: center;
                gap: 8px;
                max-height: 32vh;
            }

            .choice-button {
                padding: 8px 15px;
                font-size: 0.85rem;
                flex: 1 1 auto;
                min-width: 120px;
            }
        }

        @media screen and (min-width: 481px) and (max-width: 1024px) {
            #character-sprite {
                height: 48%;
            }

            #dialogue-box {
                width: 85%;
                min-height: 130px;
                padding: 22px;
            }

            #text-content {
                font-size: 1.1rem;
            }

            #choice-container {
                width: 100%;
            }

            .choice-button {
                padding: 14px 20px;
                font-size: 1rem;
            }
        }

        @media screen and (min-width: 600px) and (max-width: 1024px) and (orientation: portrait) {
            #character-sprite {
                height: 40%;
                bottom: var(--sprite-bottom-offset, 18%);
            }

            #dialogue-box {
                margin-bottom: 30px;
            }
        }

        #admin-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 170;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 0.78rem;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            opacity: 0.85;
            transition: opacity .2s, transform .2s;
        }

        #admin-btn:hover {
            opacity: 1;
            transform: translateY(-1px);
        }

        #progress-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-family: inherit;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            user-select: none;
            pointer-events: none;
        }

        #progress-badge .label {
            opacity: 0.7;
            margin-right: 6px;
        }

        #progress-badge .num {
            font-weight: 700;
            color: #ffd166;
        }

        #start-menu {
            position: absolute;
            inset: 0;
            z-index: 150;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 24px;
            box-sizing: border-box;
            background: radial-gradient(circle at center, rgba(255, 209, 102, 0.12), rgba(0, 0, 0, 0.78));
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }

        .start-menu-card {
            width: min(92vw, 440px);
            max-height: calc(100dvh - 48px);
            overflow-y: auto;
            padding: 34px 28px;
            box-sizing: border-box;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.78);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .start-menu-title {
            margin: 0;
            font-size: clamp(2.2rem, 8vw, 4rem);
            line-height: 1;
            color: #ffd166;
            text-shadow: 0 4px 24px rgba(255, 209, 102, 0.45);
        }

        .start-menu-subtitle {
            margin: 14px 0 26px;
            color: rgba(255, 255, 255, 0.78);
            font-size: 1rem;
        }

        .menu-button {
            width: 100%;
            border: 0;
            border-radius: 999px;
            padding: 14px 20px;
            margin-top: 12px;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform .2s, filter .2s, background .2s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .menu-button:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .menu-button.primary {
            background: linear-gradient(135deg, #ffd166, #ff8fab);
            color: #171717;
        }

        .menu-button.secondary {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .player-panel {
            margin-top: 18px;
            padding: 16px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            text-align: left;
        }

        #settings-panel {
            margin-top: 18px;
            padding: 18px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            text-align: left;
        }

        #settings-panel[hidden] {
            display: none;
        }

        .settings-label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.86);
            font-size: 0.92rem;
        }

        #username-input,
        #player-name-input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 12px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 1rem;
            color: #fff;
            background: rgba(0, 0, 0, 0.35);
            outline: none;
        }

        #username-input:focus,
        #player-name-input:focus {
            border-color: #ffd166;
            box-shadow: 0 0 0 3px rgba(255, 209, 102, 0.16);
        }

        .stat-note {
            margin-top: 8px;
            color: rgba(255, 255, 255, 0.58);
            font-size: 0.76rem;
            line-height: 1.45;
        }

        .settings-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .settings-actions .menu-button {
            margin-top: 0;
            padding: 10px 14px;
            font-size: 0.92rem;
        }

        .click-hint {
            position: absolute;
            bottom: 10px;
            right: 20px;
            color: #888;
            font-size: 0.8rem;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div id="game-container" style="background-image: url('image/bg.png');">

        <div id="progress-badge"><span class="label">🎯 ข้อที่</span><span class="num"
                id="progress-num">0 / 0</span></div>

        <div id="start-menu">
            <a id="admin-btn" href="admin.html" title="Admin Panel">⚙️ Admin</a>
            <div class="start-menu-card">
                <h1 class="start-menu-title">Game Math</h1>
                <p class="start-menu-subtitle">ผู้สอน: <span
                        id="menu-teacher-name">Mr.EAKAPOT</span></p>
                <div class="player-panel">
                    <label class="settings-label"
                        for="player-name-input">ชื่อผู้เล่น</label>
                    <input id="player-name-input" type="text" maxlength="32" autocomplete="off"
                        placeholder="ใส่ชื่อของคุณ">
                    <div class="stat-note">
                        ระบบจะจำชื่อ คะแนน เวลา และข้อมูลเครื่องไว้ในเครื่องนี้
                    </div>
                </div>
                <button id="play-btn" class="menu-button primary" type="button">▶ Play</button>
                <button id="settings-btn" class="menu-button secondary" type="button">⚙ Setting</button>
                <div id="settings-panel" hidden>
                    <label class="settings-label"
                        for="username-input">เปลี่ยนชื่อของ Mr.EAKAPOT</label>
                    <input id="username-input" type="text" maxlength="32" autocomplete="off">
                    <div class="settings-actions">
                        <button id="save-settings-btn" class="menu-button primary"
                            type="button">บันทึก</button>
                        <button id="cancel-settings-btn" class="menu-button secondary"
                            type="button">ยกเลิก</button>
                    </div>
                </div>
            </div>
        </div>

        <img id="character-sprite" class="pos-center" onclick="handleSpriteClick(event)">

        <div id="dialogue-box" onclick="handleInput()">
            <div id="name-tag">ระบบ</div>
            <div id="text-content">
                กดเพื่อเริ่มเกม...
            </div>
            <div id="choice-toolbar" hidden>
                <span
                    id="choice-mode-label">เลือกคำตอบ</span>
                <button id="question-toggle-btn"
                    type="button">ดูคำถาม</button>
            </div>
            <div id="choice-container"></div>
            <div class="click-hint">กด คลิก ที่กล่องข้อความเพื่อไปต่อ</div>
        </div>
    </div>

    <script src="story.js"></script>
    <script>
        const DEFAULTS = { position: "center", speaking: true, typeSpeed: 40 };
        const DEFAULT_TEACHER_NAME = "Mr.EAKAPOT";
        const TEACHER_NAME_STORAGE_KEY = "vn_teacher_name";
        const PLAYER_NAME_STORAGE_KEY = "vn_player_name";
        const PLAYER_STATS_STORAGE_KEY = "vn_player_stats";
        const CLIENT_INFO_STORAGE_KEY = "vn_client_info";
        const MAX_PLAYER_STATS = 100;
        let STAGE_BACKGROUNDS = [
            { min: 1, max: 10, bg: "image/bg.png" },
            { min: 11, max: 15, bg: "image/bg1.png" },
            { min: 16, max: 20, bg: "image/bg2.png" },
            { min: 21, max: 25, bg: "image/bg3.png" },
            { min: 26, max: 30, bg: "image/bg4.png" },
        ];
        let STAGE_SOUNDS = [];
        let STAGE_SPRITES = [];
        let STAGE_SHAKES = [];

        let currentSceneId = "start";
        let isWaitingForChoice = false;
        let isTyping = false;
        let typewriterInterval = null;
        let typewriterFrame = null;
        let currentFullText = "";
        let currentBg = "";
        let currentSprite = "";
        let spriteFadeTimer = null;
        const preloadedAssets = new Set();
        let backgroundWarmupStarted = false;
        let isStartMenuOpen = true;
        let teacherName = loadTeacherName();
        let playerName = loadPlayerName();
        let runStartedAt = 0;
        let clientInfo = loadClientInfo();
        let hasPendingChoices = false;
        let isViewingQuestion = false;
        let currentQuestionText = "";

        const randomHistory = {};
        let lastRandomParent = null;

        const STORAGE_KEY = "vn_best_record";
        function loadRecord() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { best: 0, last: 0 }; } catch { return { best: 0, last: 0 }; } }
        function saveRecord(rec) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(rec)); } catch { } }
        function commitRunScore(score, outcome) {
            score = Math.max(0, Number(score) || 0);
            const rec = loadRecord();
            rec.last = score;
            if (score > rec.best) rec.best = score;
            saveRecord(rec);
            savePlayerStats(score, outcome);
        }

        let secretClickCount = 0;
        const SECRET_CLICKS_NEEDED = 10;
        const SECRET_TRIGGER_SCENE = "1";
        const SECRET_TARGET_SCENE = "s1";

        const $container = document.getElementById('game-container');
        const $sprite = document.getElementById('character-sprite');
        const $nameTag = document.getElementById('name-tag');
        const $textContent = document.getElementById('text-content');
        const $choiceContainer = document.getElementById('choice-container');
        const $clickHint = document.querySelector('.click-hint');
        const $progress = document.getElementById('progress-badge');
        const $progNum = document.getElementById('progress-num');
        const $dialogueBox = document.getElementById('dialogue-box');
        const $startMenu = document.getElementById('start-menu');
        const $playBtn = document.getElementById('play-btn');
        const $settingsBtn = document.getElementById('settings-btn');
        const $settingsPanel = document.getElementById('settings-panel');
        const $usernameInput = document.getElementById('username-input');
        const $saveSettingsBtn = document.getElementById('save-settings-btn');
        const $cancelSettingsBtn = document.getElementById('cancel-settings-btn');
        const $menuTeacherName = document.getElementById('menu-teacher-name');
        const $playerNameInput = document.getElementById('player-name-input');
        const $choiceToolbar = document.getElementById('choice-toolbar');
        const $questionToggleBtn = document.getElementById('question-toggle-btn');
        const $choiceModeLabel = document.getElementById('choice-mode-label');

        function loadTeacherName() {
            try { const saved = localStorage.getItem(TEACHER_NAME_STORAGE_KEY); return saved && saved.trim() ? saved.trim() : DEFAULT_TEACHER_NAME; } catch { return DEFAULT_TEACHER_NAME; }
